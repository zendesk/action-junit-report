xt><text x="644" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#E6EDF3">AssertionError: expected 3</text><text x="644" y="284" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#E6EDF3">to equal 4</text></g>
