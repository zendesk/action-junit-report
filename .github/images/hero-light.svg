<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">action-junit-report</title>
  <desc id="d">action-junit-report: JUnit XML reports become a pull request check with pass/fail counts and an inline annotation on the failing line</desc>
  <rect x="0" y="0" width="1200" height="360" rx="24" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
