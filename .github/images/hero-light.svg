xt><text x="644" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#1F2328">AssertionError: expected 3</text><text x="644" y="284" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#1F2328">to equal 4</text></g>
